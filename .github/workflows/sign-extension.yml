name: Sign browser extension

# Release Firefox only permanently installs signed extensions, so every
# release ships a signed .xpi that users can install once and keep. Requires
# repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET, from
# https://addons.mozilla.org/developers/addon/api/key/
#
# Actions are pinned by commit SHA, Node by exact version, and web-ext by the
# lockfile in browser/signing/, installed with lifecycle scripts disabled. Each
# signed artifact gets a build-provenance attestation bound to the workflow
# commit, and the job prints its SHA-256; browser/setup.sh must be updated to
# that tag, asset name, and digest before users can install the new build.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Install the pinned signing toolchain
        working-directory: browser/signing
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sign for self-distribution
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets are not set."
            exit 1
          fi
          browser/signing/node_modules/.bin/web-ext sign \
            --source-dir browser/firefox-extension \
            --artifacts-dir browser/dist \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Record the artifact digest
        run: |
          xpi=$(find browser/dist -name '*.xpi' -print -quit)
          [ -n "$xpi" ] || { echo "::error::no signed .xpi produced"; exit 1; }
          {
            echo "### Signed extension"
            echo
            echo "| asset | sha256 |"
            echo "| --- | --- |"
            echo "| \`$(basename "$xpi")\` | \`$(sha256sum "$xpi" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: browser/dist/*.xpi

      # Assets are never replaced: setup.sh pins each one by digest, so an
      # overwritten asset would only break installs.
      - name: Attach the signed extension to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xpi=$(find browser/dist -name '*.xpi' -print -quit)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$xpi"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-extension
          path: browser/dist/*.xpi
